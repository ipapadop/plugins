name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check skill metadata and plugin version
        run: |
          pip install pyyaml==6.0.2
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/check-plugin.py --base "origin/${{ github.base_ref }}"
          else
            # On push, compare with the commit before the push.
            python scripts/check-plugin.py --base "${{ github.event.before }}"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate marketplace and plugin
        run: |
          # Pinned: --strict fails on warnings, and new releases add checks.
          npm install -g @anthropic-ai/claude-code@2.1.306
          claude plugin validate . --strict
          claude plugin validate plugins/ipapadop-skills --strict
